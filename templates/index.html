<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trading Portfolio Dashboard</title>
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Google Fonts for clean typography -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-color: #0b0f17;
      --card-bg: #151d2a;
      --card-border: #232e42;
      --accent-green: #10b981;
      --accent-green-glow: rgba(16, 185, 129, 0.15);
      --accent-blue: #3b82f6;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --input-bg: #0f172a;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Screen Transitions */
    .screen {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: opacity 0.3s ease;
    }

    .hidden {
      display: none !important;
    }

    /* --- LOGIN CARD --- */
    .login-container {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 2.5rem;
      border-radius: 16px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }

    .login-header {
      margin-bottom: 2rem;
      text-align: center;
    }

    .login-header h1 {
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .login-header p {
      color: var(--text-muted);
      font-size: 0.875rem;
      margin-top: 0.25rem;
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
    }

    .form-group input {
      width: 100%;
      padding: 0.75rem 1rem;
      background: var(--input-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-group input:focus {
      border-color: var(--accent-blue);
    }

    .btn-submit {
      width: 100%;
      padding: 0.85rem;
      background: var(--accent-blue);
      border: none;
      border-radius: 8px;
      color: #fff;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      margin-top: 0.5rem;
    }

    .btn-submit:hover {
      background: #2563eb;
    }

    .btn-submit:active {
      transform: scale(0.99);
    }

    /* --- DASHBOARD VIEW --- */
    .dashboard-container {
      width: 100%;
      max-width: 1100px;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .dash-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--card-border);
    }

    .account-info {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: var(--accent-blue);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 1.1rem;
    }

    .account-details h2 {
      font-size: 1.1rem;
      font-weight: 600;
    }

    .account-details p {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .btn-logout {
      background: transparent;
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 0.5rem 1rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.2s;
    }

    .btn-logout:hover {
      border-color: var(--danger);
      color: var(--danger);
    }

    /* Stat Cards Grid */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1rem;
    }

    .stat-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 1.25rem;
      border-radius: 12px;
    }

    .stat-card span {
      font-size: 0.8rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .stat-card .value {
      font-size: 1.5rem;
      font-weight: 700;
      margin-top: 0.3rem;
    }

    .text-green { color: var(--accent-green); }

    /* Chart Section */
    .chart-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 1.5rem;
    }

    .chart-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .chart-header h3 {
      font-size: 1.1rem;
      font-weight: 600;
    }

    .chart-controls {
      display: flex;
      gap: 0.5rem;
      background: var(--input-bg);
      padding: 4px;
      border-radius: 8px;
      border: 1px solid var(--card-border);
    }

    .filter-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 0.35rem 0.8rem;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .filter-btn.active {
      background: var(--card-border);
      color: #fff;
    }

    .chart-wrapper {
      position: relative;
      height: 380px;
      width: 100%;
    }
  </style>
</head>
<body>

  <!-- LOGIN SCREEN -->
  <div id="login-screen" class="screen">
    <div class="login-container">
      <div class="login-header">
        <h1>Trader Portal</h1>
        <p>Enter your details to access account analytics</p>
      </div>
      <form id="login-form">
        <div class="form-group">
          <label for="account-id">Account ID</label>
          <input type="text" id="account-id" placeholder="e.g. TRADER-9921" required />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="••••••••" required />
        </div>
        <button type="submit" class="btn-submit">Sign In</button>
      </form>
    </div>
  </div>

  <!-- DASHBOARD SCREEN -->
  <div id="dashboard-screen" class="screen hidden">
    <div class="dashboard-container">

      <!-- Top Header -->
      <div class="dash-header">
        <div class="account-info">
          <div class="avatar" id="user-avatar">T</div>
          <div class="account-details">
            <h2 id="display-account-id">TRADER-9921</h2>
            <p>Live Account • MetaTrader 5</p>
          </div>
        </div>
        <button class="btn-logout" id="logout-btn">Log Out</button>
      </div>

      <!-- Stat Cards -->
      <div class="stats-grid">
        <div class="stat-card">
          <span>Starting Balance</span>
          <div class="value">$10,000.00</div>
        </div>
        <div class="stat-card">
          <span>Current Equity</span>
          <div class="value text-green" id="stat-equity">$18,450.00</div>
        </div>
        <div class="stat-card">
          <span>Total Net Profit</span>
          <div class="value text-green" id="stat-profit">+$8,450.00 (+84.5%)</div>
        </div>
        <div class="stat-card">
          <span>Win Rate</span>
          <div class="value">68.4%</div>
        </div>
      </div>

      <!-- Equity Curve Chart -->
      <div class="chart-card">
        <div class="chart-header">
          <h3>Equity Curve Analytics</h3>
          <div class="chart-controls">
            <button class="filter-btn" onclick="updateTimeframe('1M')">1M</button>
            <button class="filter-btn" onclick="updateTimeframe('3M')">3M</button>
            <button class="filter-btn active" onclick="updateTimeframe('ALL')">ALL</button>
          </div>
        </div>
        <div class="chart-wrapper">
          <canvas id="equityChart"></canvas>
        </div>
      </div>

    </div>
  </div>

  <script>
    // --- MOCK DATA FOR EQUITY CURVE ---
    const datasets = {
      '1M': {
        labels: ['Feb 01', 'Feb 05', 'Feb 10', 'Feb 15', 'Feb 20', 'Feb 25', 'Mar 01'],
        data: [15200, 15800, 15400, 16900, 17200, 17800, 18450],
        equity: '$18,450.00',
        profit: '+$3,250.00 (+21.3%)'
      },
      '3M': {
        labels: ['Dec 01', 'Dec 15', 'Jan 01', 'Jan 15', 'Feb 01', 'Feb 15', 'Mar 01'],
        data: [12000, 12800, 13500, 14200, 15200, 16900, 18450],
        equity: '$18,450.00',
        profit: '+$6,450.00 (+53.7%)'
      },
      'ALL': {
        labels: ['Jan 01', 'Jan 15', 'Feb 01', 'Feb 15', 'Mar 01', 'Mar 15', 'Apr 01', 'Apr 15', 'May 01'],
        data: [10000, 10800, 10400, 12100, 11800, 14200, 13900, 16500, 18450],
        equity: '$18,450.00',
        profit: '+$8,450.00 (+84.5%)'
      }
    };

    let equityChart = null;

    // --- DOM ELEMENTS ---
    const loginScreen = document.getElementById('login-screen');
    const dashboardScreen = document.getElementById('dashboard-screen');
    const loginForm = document.getElementById('login-form');
    const accountIdInput = document.getElementById('account-id');
    const displayAccountId = document.getElementById('display-account-id');
    const userAvatar = document.getElementById('user-avatar');
    const logoutBtn = document.getElementById('logout-btn');

    // --- AUTHENTICATION LOGIC ---
    loginForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const accountId = accountIdInput.value.trim();

      if (accountId) {
        // Update user display details
        displayAccountId.textContent = accountId;
        userAvatar.textContent = accountId.charAt(0).toUpperCase();

        // Switch screen
        loginScreen.classList.add('hidden');
        dashboardScreen.classList.remove('hidden');

        // Render Chart
        if (!equityChart) {
          initChart();
        }
      }
    });

    logoutBtn.addEventListener('click', () => {
      dashboardScreen.classList.add('hidden');
      loginScreen.classList.remove('hidden');
      accountIdInput.value = '';
      document.getElementById('password').value = '';
    });

    // --- CHART.JS INITIALIZATION ---
    function initChart() {
      const ctx = document.getElementById('equityChart').getContext('2d');

      // Create gradient fill under line
      const gradient = ctx.createLinearGradient(0, 0, 0, 350);
      gradient.addColorStop(0, 'rgba(16, 185, 129, 0.35)');
      gradient.addColorStop(1, 'rgba(16, 185, 129, 0.0)');

      equityChart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: datasets['ALL'].labels,
          datasets: [{
            label: 'Account Equity ($)',
            data: datasets['ALL'].data,
            borderColor: '#10b981',
            borderWidth: 3,
            backgroundColor: gradient,
            fill: true,
            tension: 0.35, // Smooth curve
            pointBackgroundColor: '#10b981',
            pointBorderColor: '#151d2a',
            pointBorderWidth: 2,
            pointRadius: 4,
            pointHoverRadius: 7
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: false },
            tooltip: {
              backgroundColor: '#1f293d',
              titleColor: '#9ca3af',
              bodyColor: '#10b981',
              bodyFont: { weight: 'bold', size: 14 },
              padding: 12,
              borderColor: '#232e42',
              borderWidth: 1,
              displayColors: false,
              callbacks: {
                label: (context) => `Equity: $${context.raw.toLocaleString()}`
              }
            }
          },
          scales: {
            x: {
              grid: { color: 'rgba(255, 255, 255, 0.05)' },
              ticks: { color: '#9ca3af' }
            },
            y: {
              grid: { color: 'rgba(255, 255, 255, 0.05)' },
              ticks: {
                color: '#9ca3af',
                callback: (val) => `$${val.toLocaleString()}`
              }
            }
          }
        }
      });
    }

    // --- TIMEFRAME FILTER SWITCHER ---
    function updateTimeframe(period) {
      if (!equityChart) return;

      // Update button active state
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.classList.remove('active');
        if (btn.textContent === period) btn.classList.add('active');
      });

      // Update Chart Data
      const selectedData = datasets[period];
      equityChart.data.labels = selectedData.labels;
      equityChart.data.datasets[0].data = selectedData.data;
      equityChart.update();

      // Update Header Stats
      document.getElementById('stat-equity').textContent = selectedData.equity;
      document.getElementById('stat-profit').textContent = selectedData.profit;
    }
  </script>
</body>
</html>
